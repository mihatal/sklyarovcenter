<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<title>Пересчёт набора</title>
<style>
body{font:16px/1.4 -apple-system,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;color:#111;background:#fff}
h1{font-size:22px;margin:0 0 16px}
select{font:inherit;padding:6px;width:100%;margin-bottom:10px}
label{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #eee}
label span{margin-left:auto;color:#666;white-space:nowrap}
h3{margin:18px 0 4px;font-size:15px;color:#666}
.res{margin-top:20px;padding:14px;background:#f3f3f3;border-radius:8px}
.res b{font-size:28px}
.res small{display:block;color:#666;margin-top:6px}
</style>
</head>
<body>
<h1>Пересчёт набора под купленные программы</h1>
<select id="set"></select>
<select id="ph"></select>
<div id="list"></div>
<div class="res" id="res"></div>
<script>
// Данные с лендинга «Комплексная неделя»
var P=[
 ['Центральное соотношение',9900],['Повышение прикуса на практике',9900],['Эффективные планы',5100],
 ['Dental Boost',3500],['Управление высокими рисками',990],
 ['Увеличители прибыли',3500],['Мотивация команды',9400],['Дорогие планы лечения',11000],
 ['Пациенты по рекомендации',9500],['Brand Boost',11900],
 ['Сильная команда клиники (курс Синдеева)',49900],['Эстетика улыбки и лица',36900]
];
var SETS=[['Клинический',5],['Клиника и бизнес',10],['Максимальный',12]]; // первые N программ из P
var PH=[['до 9 октября',[17900,31900,57900]],['10–15 октября',[19900,34900,64900]],['16–18 октября',[22900,39900,74900]]];
var $=function(id){return document.getElementById(id)};
var rub=function(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'};
SETS.forEach(function(s,i){$('set').add(new Option('Набор «'+s[0]+'»',i))});
PH.forEach(function(p,i){$('ph').add(new Option('Цена '+p[0],i))});
var d=new Date(),day=d.getMonth()==9?d.getDate():0;
$('ph').value=day>15?2:day>9?1:0;
$('set').value=2;

function draw(){
 var n=SETS[$('set').value][1],h='';
 P.slice(0,n).forEach(function(p,i){
  if(i==0)h+='<h3>Клинический</h3>';if(i==5)h+='<h3>Клиника и бизнес</h3>';if(i==10)h+='<h3>Максимальный</h3>';
  h+='<label><input type="checkbox" value="'+i+'">'+p[0]+'<span>'+rub(p[1])+'</span></label>';
 });
 $('list').innerHTML=h;calc();
}
function calc(){
 var si=$('set').value,n=SETS[si][1],price=PH[$('ph').value][1][si],total=0,bought=0;
 P.slice(0,n).forEach(function(p){total+=p[1]});
 document.querySelectorAll('#list input:checked').forEach(function(c){bought+=P[c.value][1]});
 var cut=price*bought/total;
 $('res').innerHTML='Выставить: <b>'+rub(price-cut)+'</b><small>Цена набора '+rub(price)+' − '+rub(cut)+
  ' (куплено на '+rub(bought)+' из '+rub(total)+', '+(bought/total*100).toFixed(1)+'%)</small>';
}
$('set').onchange=draw;$('ph').onchange=calc;$('list').onchange=calc;
draw();
</script>
</body>
</html>
